name = "rsshub"
workers_dev = true
keep_vars = true
assets = { directory = "lib/assets" }
compatibility_date = "2026-09-01"
compatibility_flags = ["global_fetch_strictly_public", "temporal"]
main = "dist-worker/worker.mjs"
no_bundle = true
find_additional_modules = true
base_dir = "dist-worker"
rules = [{ type = "ESModule", globs = ["**/*.mjs", "vendor/**/*.js"] }, { type = "CompiledWasm", globs = ["**/*.wasm"] }, { type = "Data", globs = ["data_files/**"] }]

[build]
command = "pnpm run worker-build"

[observability]
enabled = true

[[kv_namespaces]]
binding = "CACHE"

[vars]
CACHE_EXPIRE = "900"
DEBUG_INFO = "false"
